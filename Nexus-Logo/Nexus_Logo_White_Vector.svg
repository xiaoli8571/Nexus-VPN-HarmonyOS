<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Pure Studio White) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F9FD"/>
    </linearGradient>

    <!-- Center Ambient Illumination -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Left Pillar Gradient (Royal Blue to Deep Cobalt) -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0091FF"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0A3E92"/>
    </linearGradient>

    <!-- Right Pillar Gradient (Cyan to Electric Blue) -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#054FAF"/>
    </linearGradient>

    <!-- Diagonal Nexus Bridge Gradient -->
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#0088FF"/>
      <stop offset="70%" stop-color="#0062E3"/>
      <stop offset="100%" stop-color="#072B6B"/>
    </linearGradient>

    <!-- Core Hub Gradient -->
    <radialGradient id="coreInnerGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="40%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#052669"/>
    </radialGradient>

    <!-- Soft Ambient Drop Shadow for White Background -->
    <filter id="nexusShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="18" dy="30" stdDeviation="24" flood-color="#0F2856" flood-opacity="0.18"/>
    </filter>

    <!-- Inner Bridge Shadow -->
    <filter id="bridgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="16" stdDeviation="14" flood-color="#051433" flood-opacity="0.32"/>
    </filter>

    <!-- Core Glow -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Background (Squircle compatible for HarmonyOS & iOS) -->
  <rect width="1024" height="1024" rx="228" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#centerGlow)"/>

  <!-- Master Nexus 'N' Emblem -->
  <g filter="url(#nexusShadow)">
    <!-- Left Vertical Pillar -->
    <line x1="352" y1="312" x2="352" y2="712" stroke="url(#leftGrad)" stroke-width="110" stroke-linecap="round"/>
    <!-- Left Pillar Top Highlight -->
    <line x1="312" y1="350" x2="312" y2="670" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.5" stroke-linecap="round"/>

    <!-- Right Vertical Pillar -->
    <line x1="672" y1="312" x2="672" y2="712" stroke="url(#rightGrad)" stroke-width="110" stroke-linecap="round"/>
    <!-- Right Pillar Top Highlight -->
    <line x1="632" y1="350" x2="632" y2="670" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.65" stroke-linecap="round"/>

    <!-- Diagonal Nexus Bridge (Casts depth shadow over vertical pillars) -->
    <g filter="url(#bridgeShadow)">
      <line x1="352" y1="372" x2="672" y2="652" stroke="url(#diagGrad)" stroke-width="110" stroke-linecap="round"/>
      <line x1="372" y1="346" x2="652" y2="626" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.55" stroke-linecap="round"/>
    </g>

    <!-- Central Nexus Convergence Hub -->
    <g transform="translate(512, 512)" filter="url(#coreGlow)">
      <!-- Outer Dark Slate Bezel -->
      <circle cx="0" cy="0" r="88" fill="#0A1838"/>
      <!-- Glowing Electric Cyan Accent Ring -->
      <circle cx="0" cy="0" r="80" fill="none" stroke="#00F0FF" stroke-width="6"/>
      <!-- Inner Convergence Sphere -->
      <circle cx="0" cy="0" r="74" fill="url(#coreInnerGrad)"/>
      <!-- Specular Highlight -->
      <ellipse cx="-20" cy="-24" rx="30" ry="18" transform="rotate(-30 -20 -24)" fill="#FFFFFF" opacity="0.6"/>

      <!-- Central 4-Point Nexus Cross Star -->
      <path d="M 0,-34 Q 0,0 34,0 Q 0,0 0,34 Q 0,0 -34,0 Q 0,0 0,-34 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="5" fill="#00F0FF"/>
    </g>

    <!-- 4 Endpoint Node Indicators (Network Vertices) -->
    <!-- Top-Left Node -->
    <g transform="translate(352, 312)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="16" fill="#007AFF"/>
      <circle cx="0" cy="0" r="8" fill="#00F0FF"/>
    </g>

    <!-- Bottom-Left Node -->
    <g transform="translate(352, 712)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="16" fill="#0A3E92"/>
      <circle cx="0" cy="0" r="8" fill="#00F0FF"/>
    </g>

    <!-- Top-Right Node -->
    <g transform="translate(672, 312)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="16" fill="#00E5FF"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>

    <!-- Bottom-Right Node -->
    <g transform="translate(672, 712)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="16" fill="#007AFF"/>
      <circle cx="0" cy="0" r="8" fill="#00F0FF"/>
    </g>
  </g>
</svg>